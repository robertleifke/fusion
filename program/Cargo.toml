[package]
name = "fusion"
version = "0.1.0"
description = "No-crank fully onchain orderbook MVP"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fusion"

[features]
bpf-entrypoint = []
default = []

[dependencies]
borsh = "0.10.4"
fusion_engine = { path = "../crates/fusion_engine" }
pinocchio = { version = "0.11.1", features = ["cpi"] }
pinocchio-token-2022 = "0.3.1"
solana-instruction-view = { version = "2.1.0", features = ["cpi"] }
solana-address = { version = "2.6.0", features = ["curve25519"] }
solana-program = "2.3.0"
solana-program-error = "3.0.1"
